<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAJA SMM - Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080b20;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      background: #10143a;
      border-bottom: 1px solid #292e61;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #7c5cff;
    }

    .logout {
      background: #ff4d6d;
      color: white;
      border: 0;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .welcome {
      color: #aeb4d0;
      margin-bottom: 30px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .card {
      background: #111638;
      border: 1px solid #292e61;
      border-radius: 14px;
      padding: 22px;
    }

    .card span {
      display: block;
      color: #9299bd;
      margin-bottom: 8px;
    }

    .card strong {
      font-size: 25px;
    }

    .panel {
      background: #111638;
      border: 1px solid #292e61;
      border-radius: 14px;
      padding: 22px;
    }

    .panel h2 {
      margin-bottom: 20px;
    }

    .service {
      background: #191e48;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .order-btn {
      background: #6d5dfc;
      color: white;
      border: 0;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .cards {
        grid-template-columns: 1fr;
      }

      header {
        padding: 15px;
      }

      .logo {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">RAJA SMM</div>
    <button class="logout" onclick="logout()">Logout</button>
  </header>

  <main>
    <h1>Dashboard</h1>
    <p class="welcome">Welcome to your RAJA SMM account.</p>

    <div class="cards">
      <div class="card">
        <span>Balance</span>
        <strong>$0.00</strong>
      </div>

      <div class="card">
        <span>Total Orders</span>
        <strong>0</strong>
      </div>

      <div class="card">
        <span>Active Orders</span>
        <strong>0</strong>
      </div>

      <div class="card">
        <span>Services</span>
        <strong>100+</strong>
      </div>
    </div>

    <div class="panel">
      <h2>Available Services</h2>

      <div class="service">
        <span>Instagram Marketing</span>
        <button class="order-btn" onclick="order()">Order</button>
      </div>

      <div class="service">
        <span>TikTok Marketing</span>
        <button class="order-btn" onclick="order()">Order</button>
      </div>

      <div class="service">
        <span>Facebook Marketing</span>
        <button class="order-btn" onclick="order()">Order</button>
      </div>

      <div class="service">
        <span>YouTube Marketing</span>
        <button class="order-btn" onclick="order()">Order</button>
      </div>
    </div>
  </main>

  <script>
    const session = localStorage.getItem("raja_smm_session");

    if (!session) {
      window.location.href = "index.html";
    }

    function logout() {
      localStorage.removeItem("raja_smm_session");
      window.location.href = "index.html";
    }

    function order() {
      alert("Service order system next step mein connect karenge.");
    }
  </script>

</body>
</html>
